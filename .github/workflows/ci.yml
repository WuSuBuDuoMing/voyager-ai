name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate app.json
        run: |
          echo "=== Validating app.json ==="
          if [ ! -f app.json ]; then
            echo "ERROR: app.json not found"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            if (!config.pages || !Array.isArray(config.pages) || config.pages.length === 0) {
              console.error('ERROR: app.json must have a non-empty pages array');
              process.exit(1);
            }
            console.log('app.json is valid. Pages:', config.pages.length);
          "

      - name: Check all pages have 4 required files
        run: |
          echo "=== Checking page file completeness ==="
          node -e "
            const fs = require('fs');
            const path = require('path');
            const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const requiredExts = ['.js', '.json', '.wxml', '.wxss'];
            let errors = [];

            for (const page of config.pages) {
              const dir = path.dirname(page);
              const name = path.basename(page);
              for (const ext of requiredExts) {
                const file = path.join(dir, name + ext);
                if (!fs.existsSync(file)) {
                  errors.push('MISSING: ' + file);
                }
              }
            }

            if (errors.length > 0) {
              console.error('Page validation failed:');
              errors.forEach(e => console.error('  ' + e));
              process.exit(1);
            } else {
              console.log('All ' + config.pages.length + ' pages have all 4 required files (.js, .json, .wxml, .wxss)');
            }
          "

      - name: Validate project structure
        run: |
          echo "=== Validating project structure ==="
          node -e "
            const fs = require('fs');
            const path = require('path');
            let errors = [];

            // Check required root files
            const requiredFiles = ['app.js', 'app.json', 'app.wxss', 'LICENSE'];
            for (const file of requiredFiles) {
              if (!fs.existsSync(file)) {
                errors.push('MISSING: ' + file);
              }
            }

            // Check services directory
            const serviceDir = 'services';
            if (fs.existsSync(serviceDir)) {
              const services = fs.readdirSync(serviceDir).filter(f => f.endsWith('.js'));
              console.log('Services found:', services.length);
            } else {
              errors.push('MISSING: services/ directory');
            }

            // Check utils directory
            const utilsDir = 'utils';
            if (fs.existsSync(utilsDir)) {
              const utils = fs.readdirSync(utilsDir).filter(f => f.endsWith('.js'));
              console.log('Utils found:', utils.length);
            } else {
              errors.push('MISSING: utils/ directory');
            }

            // Check components
            const componentsDir = 'components';
            if (fs.existsSync(componentsDir)) {
              const components = fs.readdirSync(componentsDir);
              console.log('Components found:', components.length);
            } else {
              errors.push('MISSING: components/ directory');
            }

            if (errors.length > 0) {
              console.error('Validation failed:');
              errors.forEach(e => console.error('  ' + e));
              process.exit(1);
            }
            console.log('Project structure is valid.');
          "

      - name: Check for required documentation files
        run: |
          echo "=== Checking documentation files ==="
          for file in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file not found"
              exit 1
            else
              echo "FOUND: $file"
            fi
          done

      - name: Verify version consistency
        run: |
          echo "=== Checking version consistency ==="
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('project.config.json', 'utf8'));
            const appContent = fs.readFileSync('app.js', 'utf8');
            const versionMatch = appContent.match(/version:\s*['\"]([^'\"]+)['\"]/);

            if (!pkg.version) {
              console.error('ERROR: version not found in project.config.json');
              process.exit(1);
            }

            console.log('project.config.json version:', pkg.version);

            if (versionMatch) {
              console.log('app.js version:', versionMatch[1]);
              if (versionMatch[1] !== pkg.version) {
                console.error('ERROR: Version mismatch between project.config.json and app.js');
                process.exit(1);
              }
            } else {
              console.log('WARNING: Could not extract version from app.js');
            }
            console.log('Version check passed.');
          "

      - name: Verify JSDoc coverage in services
        run: |
          echo "=== Checking JSDoc coverage in service files ==="
          node -e "
            const fs = require('fs');
            const path = require('path');
            const serviceDir = 'services';
            const files = fs.readdirSync(serviceDir).filter(f => f.endsWith('.js'));
            let warnings = 0;

            for (const file of files) {
              const content = fs.readFileSync(path.join(serviceDir, file), 'utf8');
              const hasModule = content.includes('@module');
              const jsdocCount = (content.match(/\/\*\*/g) || []).length;

              if (!hasModule) {
                console.error('WARNING: ' + file + ' missing @module tag');
                warnings++;
              }
              if (jsdocCount < 3) {
                console.error('WARNING: ' + file + ' has only ' + jsdocCount + ' JSDoc blocks (expected 3+)');
                warnings++;
              }
              console.log(file + ': ' + jsdocCount + ' JSDoc blocks, @module: ' + (hasModule ? 'yes' : 'no'));
            }

            if (warnings > 0) {
              console.log('Found ' + warnings + ' JSDoc warning(s)');
            } else {
              console.log('All service files have adequate JSDoc coverage.');
            }
          "

      - name: Verify JSDoc coverage in utilities
        run: |
          echo "=== Checking JSDoc coverage in utility files ==="
          node -e "
            const fs = require('fs');
            const path = require('path');
            const utilDir = 'utils';
            const files = fs.readdirSync(utilDir).filter(f => f.endsWith('.js'));
            let warnings = 0;

            for (const file of files) {
              const content = fs.readFileSync(path.join(utilDir, file), 'utf8');
              const hasModule = content.includes('@module');
              const jsdocCount = (content.match(/\/\*\*/g) || []).length;

              if (!hasModule) {
                console.error('WARNING: ' + file + ' missing @module tag');
                warnings++;
              }
              console.log(file + ': ' + jsdocCount + ' JSDoc blocks, @module: ' + (hasModule ? 'yes' : 'no'));
            }

            if (warnings > 0) {
              console.log('Found ' + warnings + ' JSDoc warning(s)');
            } else {
              console.log('All utility files have adequate JSDoc coverage.');
            }
          "

      - name: Run test suite
        run: |
          echo "=== Running test suite ==="
          npm test
